           C 88 18, 106 36, 106 60
           C 106 78, 94 90, 78 94
           C 90 84, 92 68, 82 56
           C 74 46, 60 44, 50 50
           C 66 46, 80 56, 80 72
           C 80 88, 66 98, 50 96
           C 30 93, 18 76, 22 56
           C 26 36, 44 18, 64 18 Z"
        fill="url(#flame)"/>

  <!-- inner negative-space N monogram -->
  <path d="M46 46 L46 82 L54 82 L54 60 L74 82 L82 82 L82 46 L74 46 L74 68 L54 46 Z"
        fill="#021824"/>

  <!-- center accent dot -->
  <circle cx="64" cy="64" r="3.5" fill="#FAFAF8"/>
</svg>
