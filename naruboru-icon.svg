<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A3C"/>
      <stop offset="100%" stop-color="#FF7601"/>
    </linearGradient>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0A2A3D"/>
      <stop offset="100%" stop-color="#021824"/>
    </radialGradient>
  </defs>

  <!-- badge background -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)" stroke="#FF7601" stroke-width="2"/>

  <!-- outer swirl (uchiwa fan + flame hybrid) -->
